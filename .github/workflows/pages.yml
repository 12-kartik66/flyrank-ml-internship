name: pages

# Deploys the capstone research paper (paper/) to GitHub Pages.
# The live URL is https://<owner>.github.io/flyrank-ml-internship/
# and is recorded in submission/paper_url.txt.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-paper:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload paper as site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: paper

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4